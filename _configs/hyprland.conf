# #######################################################################################
# HIROSHI'S HYPRLAND CONFIGURATION
# #######################################################################################

#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#

autogenerated = 0 # remove this line to remove the warning

# See https://wiki.hyprland.org/Configuring/Monitors/

# Workstation
# monitor = eDP-1, 1920x1080@60.05, 0x0, 1
# monitor = DP-4, 1920x1080@60, 1920x0, 1
# monitor = DP-3, 1920x1080@60, 3840x0, 1

# Laptop/TV
monitor = eDP-1, preferred, auto, 1
monitor = DP-1, 1920x1080@120, auto, 1
# monitor = DP-1, 3840x2160@60, auto, 2

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
exec-once = systemctl --user start hyprpolkitagent
# exec-once = hyprpaper & sleep 2 && python /mnt/hiroshi/hyprland_dotfiles/_scripts/wallpaper_setter.py
exec-once = hyprpaper
exec-once = quickshell
# exec-once = qs -c noctalia-shell
# exec-once = [workspace 1 silent] flatpak run app.zen_browser.zen


# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Set programs that you use
$terminal = kitty
$fileManager = nautilus
$menu = wofi --show drun --conf /home/hiroshi/.config/wofi/wofi.conf

# Some default env vars.
env = XCURSOR_SIZE, 24
env = QT_QPA_PLATFORMTHEME, qt5ct # change to qt6ct if you have that
env = PATH, /home/hiroshi/.config/hypr/modules:$PATH
env = HYPRSHOT_DIR, /home/hiroshi/Pictures
# env = GTK_DEBUG, interactive 
# env = GTK_THEME, Adwaita:dark

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = yes
    }

    sensitivity = .5 # -1.0 to 1.0, 0 means no modification.

    accel_profile = flat
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 2.5
    gaps_out = 5
    border_size = 5
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = master

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    resize_on_border = true
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 10
    
    blur {
        enabled = true
        size = 4
        passes = 2
        popups = true
        # xray = true
        noise = 0
        # brightness = 1
        ignore_opacity = false
        # new_optimizations = false
    }

    shadow {
        enabled = false
    }

    # inactive_opacity = .7
    # dim_inactive = true
    # dim_strength = 0.9
}

animations {
    enabled = true

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = easeInOutBack, 0.68, -0.55, 0.265, 1.55

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
    animation = layers, 0, 6, myBezier, popin 100%
    animation = fadeLayers, 1, 20, myBezier
}


render {
    new_render_scheduling = true
}

quirks{
    prefer_hdr = 1
}


dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    new_status = master
}

# gestures {
#     # See https://wiki.hyprland.org/Configuring/Variables/ for more
#     workspace_swipe = true
# }

misc {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
windowrule = match:class .*, suppress_event maximize
windowrule = match:title (Picture-in-Picture), float on
windowrule = match:title (Picture-in-Picture), size monitor_w*0.36 monitor_h*0.36
windowrule = match:title (Picture-in-Picture), move 0 monitor_h*0.63
windowrule = match:title (Picture-in-Picture), pin on
windowrule = match:class (org\.pulseaudio\.pavucontrol), float on

# layerrule = blur on, match:namespace wofi
layerrule = blur on, match:namespace quickshell
layerrule = blur on, match:namespace quickshell_popup
layerrule = no_anim on, match:namespace quickshell_popup
layerrule = ignore_alpha 0, match:namespace quickshell_popup




# windowrulev2 = suppressevent maximize, class:.* # You'll probably like this.
# windowrulev2 = float, title:(Picture-in-Picture)
# windowrulev2 = size 36% 36%, title:(Picture-in-Picture)
# windowrulev2 = move 0% 63%, title:(Picture-in-Picture)
# windowrulev2 = pin, title:(Picture-in-Picture)
# windowrulev2 = float, class:(org\.pulseaudio\.pavucontrol)


# layerrule = blur, waybar
# layerrule = blurpopups, waybar
# layerrule = blur, wofi
# layerrule = blur, quickshell
# layerrule = blur, quickshell_popup
# layerrule = noanim, quickshell_popup
# layerrule = ignorealpha[0], quickshell_popup


# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive, 
# bind = $mainMod, M, exit,
bind = $mainMod, M, exec, hyprshutdown
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating, 
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# CUSTOM BINDS
# Volume Media Keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Brightness Media Keys
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 10%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 10%-


# #Lid Switch
# # trigger when the switch is turning on
# bindl = , switch:on:Lid Switch, exec, python '/mnt/hiroshi/hyprland_dotfiles/_scripts/lid_action.py'
# # trigger when the switch is turning off
# bindl = , switch:off:Lid Switch, exec, python '/mnt/hiroshi/hyprland_dotfiles/_scripts/lid_action.py'

# Screenshot
# bind = $mainMod, B, exec, hyprshot -m output
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, T, exec, gnome-system-monitor
bind = $mainMod, Z, exec, flatpak run app.zen_browser.zen

## Misc
bind = $mainMod, W, exec, killall quickshell && quickshell

# Change hyprpaper and hyprlock background
bind = $mainMod, B, exec, python '/mnt/hiroshi/hyprland_dotfiles/_scripts/wallpaper_setter.py'


bind = $mainMod, O, exec, hyprctl keyword monitor 'eDP-1, disable'
bind = $mainMod, P, exec, hyprctl keyword monitor 'eDP-1, preferred, auto, 1'

# bind = $mainMod, period, layoutmsg, move +col
# bind = $mainMod, comma, layoutmsg, swapcol l